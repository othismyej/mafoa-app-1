# Environnement de développement local : app, PostgreSQL 16, Redis, worker Celery.
x-app: &app
  build:
    context: .
    args:
      UV_SYNC_ARGS: "--frozen"   # inclut les dépendances de dev (pytest, ruff)
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://mafoa:mafoa@db:5432/mafoa
    REDIS_URL: redis://redis:6379/0
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 + pgvector (vague 2)
    environment:
      POSTGRES_DB: mafoa
      POSTGRES_USER: mafoa
      POSTGRES_PASSWORD: mafoa      # identifiants de dev local uniquement
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafoa -d mafoa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

volumes:
  pgdata:
